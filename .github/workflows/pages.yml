name: Deploy Brand Specimen & Assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage public files
        run: |
          mkdir -p _site/assets _site/preview
          cp index.html _site/index.html
          cp assets/brand.css assets/favicon.svg assets/manifest.json _site/assets/
          if [ -f preview/specimen.png ]; then cp preview/specimen.png _site/preview/; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
